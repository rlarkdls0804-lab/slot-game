<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 슬롯 & 기억력 충전소</title>
<style>
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; background-color: #1a1a2e; color: #fff; font-family: sans-serif;
    padding: 15px; box-sizing: border-box;
  }
  .container {
    background: #16213e; padding: 25px; border-radius: 20px;
    border: 4px solid #e94560; box-shadow: 0 0 25px rgba(233, 69, 96, 0.5);
    text-align: center; max-width: 420px; width: 100%;
  }
  .top-bar {
    display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .high-score-board {
    font-size: 14px; color: #4ecca3; font-weight: bold;
    background: rgba(15, 52, 96, 0.7); padding: 6px 12px; border-radius: 20px;
  }
  .reset-btn {
    background: #0f3460; color: #aaa; border: 1px solid #334; border-radius: 15px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .reset-btn:hover { color: #fff; border-color: #e94560; }
  .score-board { font-size: 24px; margin-bottom: 20px; color: #ffd700; font-weight: bold; }
  
  /* 슬롯머신 스타일 */
  .reels { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .reel {
    width: 85px; height: 105px; background: #fff; color: #000; font-size: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; border: 3px solid #0f3460; user-select: none;
  }

  /* 배팅 금액 선택 버튼 스타일 */
  .bet-selector {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;
  }
  .bet-btn {
    flex: 1; padding: 10px 0; font-size: 15px; font-weight: bold; cursor: pointer;
    background: #0f3460; color: #ccc; border: 2px solid #0f3460; border-radius: 8px;
    transition: 0.2s;
  }
  .bet-btn.active {
    background: #1a1a2e; color: #ffd700; border-color: #ffd700;
  }
  .bet-btn:hover:not(:disabled) { border-color: #ffd700; background: #1a1a2e; }

  .main-btn {
    padding: 14px 28px; font-size: 18px; font-weight: bold; cursor: pointer;
    background: #e94560; color: white; border: none; border-radius: 10px; transition: 0.2s;
    width: 100%; margin-top: 6px;
  }
  .main-btn:disabled { background: #555; cursor: not-allowed; }
  .main-btn:hover:not(:disabled) { background: #ff5e78; transform: scale(1.02); }
  #chargeBtn { background: #4ecca3; color: #1a1a2e; display: none; }
  #chargeBtn:hover { background: #6ee7b7; }
  #message { margin-top: 18px; font-size: 16px; min-height: 24px; color: #4ecca3; font-weight: bold; }

  /* 6x6 카드 기억력 게임 스타일 */
  #memorySection { display: none; }
  .memory-info { font-size: 15px; color: #ccc; margin-bottom: 15px; }
  .grid-6x6 {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
    margin-bottom: 15px;
  }
  .card {
    aspect-ratio: 1 / 1; background: #0f3460; border: 2px solid #e94560;
    border-radius: 8px; font-size: 24px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; user-select: none; transition: 0.2s;
  }
  .card.flipped, .card.matched { background: #fff; cursor: default; }
  .card.matched { border-color: #4ecca3; opacity: 0.7; }
</style>
</head>
<body>

<div class="container">
  <!-- 1. 슬롯머신 화면 -->
  <div id="slotSection">
    <div class="top-bar">
      <div class="high-score-board">🏆 최고 기록: <span id="highScore">100</span></div>
      <button class="reset-btn" onclick="resetAllData()">초기화</button>
    </div>
    <div class="score-board">보유 코인: <span id="coins">100</span></div>
    
    <div class="reels">
      <div class="reel" id="reel1">7️⃣</div>
      <div class="reel" id="reel2">7️⃣</div>
      <div class="reel" id="reel3">7️⃣</div>
    </div>

    <!-- 배팅 금액 조절 버튼 -->
    <div class="bet-selector">
      <button class="bet-btn active" id="bet10" onclick="setBet(10)">10 코인 (x1)</button>
      <button class="bet-btn" id="bet50" onclick="setBet(50)">50 코인 (x5)</button>
      <button class="bet-btn" id="bet100" onclick="setBet(100)">100 코인 (x10)</button>
    </div>

    <button class="main-btn" id="spinBtn" onclick="spin()">SPIN (10 코인)</button>
    <button class="main-btn" id="chargeBtn" onclick="startMemoryGame()">🃏 6x6 카드 맞추기로 코인 충전 (+100)</button>
    <div id="message">배팅 금액을 선택하고 SPIN을 누르세요!</div>
  </div>

  <!-- 2. 6x6 카드 기억력 게임 화면 -->
  <div id="memorySection">
    <div class="score-board">🃏 6x6 기억력 충전소</div>
    <div class="memory-info">남은 짝: <span id="pairsLeft">18</span>쌍 | 시도 횟수: <span id="attempts">0</span>회</div>
    <div class="grid-6x6" id="cardGrid"></div>
  </div>
</div>

<script>
  const weightedSymbols = [
    '🍒', '🍒', '🍒', '🍒',
    '🍋', '🍋', '🍋', '🍋',
    '🍇', '🍇', '🍇',
    '🍉', '🍉', '🍉',
    '🍊', '🍊', '🍊',
    '🔔', '🔔',
    '💎', '💎',
    '7️⃣'
  ];

  // 안전하게 데이터 저장 및 불러오기 (localStorage + Cookie 이중 저장)
  function saveData(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {}
    document.cookie = `${key}=${value}; max-age=31536000; path=/`;
  }

  function loadData(key) {
    try {
      const val = localStorage.getItem(key);
      if (val !== null) return val;
    } catch (e) {}
    const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
    return match ? match[2] : null;
  }

  const savedCoins = loadData('slot_user_coins');
  let coins = savedCoins !== null && !isNaN(parseInt(savedCoins, 10)) ? parseInt(savedCoins, 10) : 100;

  const savedHigh = loadData('slot_high_score');
  let highScore = savedHigh !== null && !isNaN(parseInt(savedHigh, 10)) ? parseInt(savedHigh, 10) : Math.max(100, coins);

  let currentBet = 10;
  let isSpinning = false;

  // 페이지 로드 즉시 화면 업데이트
  updateCoins();
  checkCoinState();

  function resetAllData() {
    if (confirm('보유 코인과 최고 기록을 모두 100 코인으로 초기화할까요?')) {
      coins = 100;
      highScore = 100;
      saveData('slot_user_coins', 100);
      saveData('slot_high_score', 100);
      updateCoins();
      checkCoinState();
      document.getElementById('message').innerText = '데이터가 초기화되었습니다!';
    }
  }

  function setBet(amount) {
    if (isSpinning) return;
    currentBet = amount;
    
    document.querySelectorAll('.bet-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('bet' + amount).classList.add('active');
    
    document.getElementById('spinBtn').innerText = `SPIN (${currentBet} 코인)`;
    checkCoinState();
  }

  function getRandomSymbol() {
    return weightedSymbols[Math.floor(Math.random() * weightedSymbols.length)];
  }

  function spin() {
    if (isSpinning || coins < currentBet) return;
    
    coins -= currentBet;
    updateCoins();
    isSpinning = true;
    toggleBetButtons(true);
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('message').innerText = '행운을 빕니다...';

    const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    const results = [];

    reels.forEach((reel, index) => {
      let interval = setInterval(() => {
        reel.innerText = getRandomSymbol();
      }, 70);

      setTimeout(() => {
        clearInterval(interval);
        const finalSymbol = getRandomSymbol();
        reel.innerText = finalSymbol;
        results[index] = finalSymbol;

        if (index === 2) checkResult(results);
      }, 900 + index * 450);
    });
  }

  function checkResult(res) {
    let baseReward = 0;
    const multiplier = currentBet / 10;
    const msg = document.getElementById('message');

    // 3개 모두 일치 (0번, 1번, 2번 칸 비교)
    if (res === res && res === res) {
      if (res === '7️⃣') baseReward = 1000;
      else if (res === '💎') baseReward = 300;
      else baseReward = 100;
      
      const totalReward = baseReward * multiplier;
      msg.innerText = (res === '7️⃣') 
        ? `🎉 JACKPOT! 777 대박 (+${totalReward})` 
        : `✨ 3개 일치! (+${totalReward})`;
      coins += totalReward;
    } 
    // 2개 일치 (0-1, 1-2, 0-2 비교)
    else if (res === res || res === res || res === res) {
      const totalReward = 15 * multiplier;
      msg.innerText = `👍 2개 일치! (+${totalReward})`;
      coins += totalReward;
    } else {
      msg.innerText = '꽝! 다시 도전해 보세요.';
    }

    updateCoins();
    isSpinning = false;
    toggleBetButtons(false);
    checkCoinState();
  }

  function toggleBetButtons(disabled) {
    document.querySelectorAll('.bet-btn').forEach(btn => btn.disabled = disabled);
  }

  function checkCoinState() {
    const msg = document.getElementById('message');
    const spinBtn = document.getElementById('spinBtn');
    const chargeBtn = document.getElementById('chargeBtn');

    if (coins < 10) {
      spinBtn.disabled = true;
      chargeBtn.style.display = 'block';
      msg.innerText = '코인이 부족합니다! 미니게임으로 충전하세요.';
    } else if (coins < currentBet) {
      spinBtn.disabled = true;
      chargeBtn.style.display = 'none';
      msg.innerText = '보유 코인보다 배팅 금액이 큽니다. 금액을 낮춰주세요!';
    } else {
      spinBtn.disabled = false;
      chargeBtn.style.display = 'none';
    }
  }

  function updateCoins() {
    document.getElementById('coins').innerText = coins;
    saveData('slot_user_coins', coins);

    if (coins > highScore) {
      highScore = coins;
      saveData('slot_high_score', highScore);
    }
    document.getElementById('highScore').innerText = highScore;
  }

  // --- 6x6 카드 기억력 게임 로직 ---
  const cardIcons = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥑','🍔','🍕','🍩','🍦','🎈','🎁','⚽','🚀'];
  let flippedCards = [];
  let matchedPairs = 0;
  let attempts = 0;
  let lockBoard = false;

  function startMemoryGame() {
    document.getElementById('slotSection').style.display = 'none';
    document.getElementById('memorySection').style.display = 'block';
    
    const grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    flippedCards = [];
    matchedPairs = 0;
    attempts = 0;
    lockBoard = false;
코드를 사용할 때는 주의가 필요합니다.
document.getElementById('pairsLeft').innerText = '18';
document.getElementById('attempts').innerText = '0';
const deck = [...cardIcons, ...cardIcons].sort(() => Math.random() - 0.5);
deck.forEach((icon) => {
const card = document.createElement('div');
card.classList.add('card');
card.dataset.icon = icon;
card.innerText = '❓';
card.onclick = () => flipCard(card);
grid.appendChild(card);
});
}
function flipCard(card) {
if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;
card.classList.add('flipped');
card.innerText = card.dataset.icon;
flippedCards.push(card);
if (flippedCards.length === 2) {
attempts++;
document.getElementById('attempts').innerText = attempts;
checkForMatch();
}
}
function checkForMatch() {
lockBoard = true;
const [card1, card2] = flippedCards;
if (card1.dataset.icon === card2.dataset.icon) {
card1.classList.add('matched');
card2.classList.add('matched');
matchedPairs++;
document.getElementById('pairsLeft').innerText = 18 - matchedPairs;
flippedCards = [];
lockBoard = false;
if (matchedPairs === 18) {
setTimeout(() => {
alert(축하합니다! ${attempts}번 만에 모두 맞춰 100 코인이 충전되었습니다!);
coins += 100;
updateCoins();
document.getElementById('memorySection').style.display = 'none';
document.getElementById('slotSection').style.display = 'block';
checkCoinState();
document.getElementById('message').innerText = '코인 충전 완료! 다시 돌려보세요.';
}, 400);
}
} else {
setTimeout(() => {
card1.classList.remove('flipped');
card2.classList.remove('flipped');
card1.innerText = '❓';
card2.innerText = '❓';
flippedCards = [];
lockBoard = false;
}, 650);
}
}
