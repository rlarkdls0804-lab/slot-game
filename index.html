<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 슬롯 & 기억력 충전소</title>
<style>
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#1a1a2e; color:#fff; font-family:sans-serif; padding:15px; box-sizing:border-box; }
  .container { background:#16213e; padding:25px; border-radius:20px; border:4px solid #e94560; box-shadow:0 0 25px rgba(233,69,96,0.5); text-align:center; max-width:420px; width:100%; }
  .top-bar { display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:8px; }
  .high-score-board { font-size:14px; color:#4ecca3; font-weight:bold; background:rgba(15,52,96,0.7); padding:6px 12px; border-radius:20px; }
  .reset-btn { background:#0f3460; color:#aaa; border:1px solid #334; border-radius:15px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .score-board { font-size:24px; margin-bottom:20px; color:#ffd700; font-weight:bold; }
  .reels { display:flex; justify-content:center; gap:12px; margin-bottom:20px; }
  .reel { width:85px; height:105px; background:#fff; color:#000; font-size:48px; display:flex; align-items:center; justify-content:center; border-radius:10px; border:3px solid #0f3460; user-select:none; }
  .bet-selector { display:flex; justify-content:center; gap:8px; margin-bottom:12px; }
  .bet-btn { flex:1; padding:10px 0; font-size:15px; font-weight:bold; cursor:pointer; background:#0f3460; color:#ccc; border:2px solid #0f3460; border-radius:8px; }
  .bet-btn.active { background:#1a1a2e; color:#ffd700; border-color:#ffd700; }
  .main-btn { padding:14px 28px; font-size:18px; font-weight:bold; cursor:pointer; background:#e94560; color:#fff; border:none; border-radius:10px; width:100%; margin-top:6px; }
  .main-btn:disabled { background:#555; cursor:not-allowed; }
  #chargeBtn { background:#4ecca3; color:#1a1a2e; display:none; }
  #message { margin-top:18px; font-size:16px; min-height:24px; color:#4ecca3; font-weight:bold; }
  #memorySection { display:none; }
  .memory-info { font-size:15px; color:#ccc; margin-bottom:15px; }
  .grid-6x6 { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-bottom:15px; }
  .card { aspect-ratio:1/1; background:#0f3460; border:2px solid #e94560; border-radius:8px; font-size:24px; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .card.flipped, .card.matched { background:#fff; cursor:default; }
  .card.matched { border-color:#4ecca3; opacity:0.7; }
</style>
</head>
<body>
<div class="container">
  <div id="slotSection">
    <div class="top-bar">
      <div class="high-score-board">🏆 최고 기록: <span id="highScore">100</span></div>
      <button type="button" class="reset-btn" id="resetBtn">초기화</button>
    </div>
    <div class="score-board">보유 코인: <span id="coins">100</span></div>
    <div class="reels">
      <div class="reel" id="reel1">7️⃣</div>
      <div class="reel" id="reel2">7️⃣</div>
      <div class="reel" id="reel3">7️⃣</div>
    </div>
    <div class="bet-selector">
      <button type="button" class="bet-btn active" id="bet10">10 코인 (x1)</button>
      <button type="button" class="bet-btn" id="bet50">50 코인 (x5)</button>
      <button type="button" class="bet-btn" id="bet100">100 코인 (x10)</button>
    </div>
    <button type="button" class="main-btn" id="spinBtn">SPIN (10 코인)</button>
    <button type="button" class="main-btn" id="chargeBtn">🃏 6x6 카드 맞추기로 코인 충전 (+100)</button>
    <div id="message">배팅 금액을 선택하고 SPIN을 누르세요!</div>
  </div>
  <div id="memorySection">
    <div class="score-board">🃏 6x6 기억력 충전소</div>
    <div class="memory-info">남은 짝: <span id="pairsLeft">18</span>쌍 | 시도: <span id="attempts">0</span>회</div>
    <div class="grid-6x6" id="cardGrid"></div>
  </div>
</div>
<script>
  var symbols = ['🍒','🍒','🍒','🍒','🍋','🍋','🍋','🍋','🍇','🍇','🍇','🍉','🍉','🍉','🍊','🍊','🍊','🔔','🔔','💎','💎','7️⃣'];
  function saveNum(k, n) { try { localStorage.setItem(k, String(n)); } catch(e) {} }
  function loadNum(k, d) { try { var v = localStorage.getItem(k); return (v !== null && v !== "" && !isNaN(Number(v))) ? Number(v) : d; } catch(e) { return d; } }

  var coins = loadNum('slot_coins_v4', 100);
  var highScore = loadNum('slot_high_v4', Math.max(100, coins));
  var currentBet = 10, isSpinning = false;
  var spinBtn = document.getElementById('spinBtn'), chargeBtn = document.getElementById('chargeBtn'), msgEl = document.getElementById('message');

  function updateDisplay() {
    document.getElementById('coins').innerText = coins;
    saveNum('slot_coins_v4', coins);
    if (coins > highScore) { highScore = coins; saveNum('slot_high_v4', highScore); }
    document.getElementById('highScore').innerText = highScore;
    if (coins < 10) { spinBtn.disabled = true; chargeBtn.style.display = 'block'; msgEl.innerText = '코인이 부족합니다! 미니게임으로 충전하세요.'; }
    else if (coins < currentBet) { spinBtn.disabled = true; chargeBtn.style.display = 'none'; msgEl.innerText = '보유 코인보다 배팅 금액이 큽니다!'; }
    else { spinBtn.disabled = isSpinning; chargeBtn.style.display = 'none'; }
  }

  function selectBet(amt) {
    if (isSpinning) return;
    currentBet = amt;
    document.getElementById('bet10').className = (amt === 10) ? 'bet-btn active' : 'bet-btn';
    document.getElementById('bet50').className = (amt === 50) ? 'bet-btn active' : 'bet-btn';
    document.getElementById('bet100').className = (amt === 100) ? 'bet-btn active' : 'bet-btn';
    spinBtn.innerText = 'SPIN (' + currentBet + ' 코인)';
    updateDisplay();
  }

  document.getElementById('bet10').onclick = function() { selectBet(10); };
  document.getElementById('bet50').onclick = function() { selectBet(50); };
  document.getElementById('bet100').onclick = function() { selectBet(100); };
  document.getElementById('resetBtn').onclick = function() {
    if (confirm('코인과 최고 기록을 100으로 초기화할까요?')) { coins = 100; highScore = 100; updateDisplay(); msgEl.innerText = '초기화되었습니다!'; }
  };

  function randSym() { return symbols.slice(Math.floor(Math.random() * symbols.length)).shift(); }

  spinBtn.onclick = function() {
    if (isSpinning || coins < currentBet) return;
    coins -= currentBet; isSpinning = true; updateDisplay(); msgEl.innerText = '행운을 빕니다...';
    var r1El = document.getElementById('reel1'), r2El = document.getElementById('reel2'), r3El = document.getElementById('reel3');
    var t1 = setInterval(function() { r1El.innerText = randSym(); }, 70);
    var t2 = setInterval(function() { r2El.innerText = randSym(); }, 70);
    var t3 = setInterval(function() { r3El.innerText = randSym(); }, 70);
    var r1 = '', r2 = '', r3 = '';
    setTimeout(function() { clearInterval(t1); r1 = randSym(); r1El.innerText = r1; }, 900);
    setTimeout(function() { clearInterval(t2); r2 = randSym(); r2El.innerText = r2; }, 1350);
    setTimeout(function() {
      clearInterval(t3); r3 = randSym(); r3El.innerText = r3;
      var mult = currentBet / 10;
      if (r1 === r2 && r2 === r3) {
        var win = ((r1 === '7️⃣') ? 1000 : (r1 === '💎' ? 300 : 100)) * mult;
        coins += win; msgEl.innerText = (r1 === '7️⃣') ? '🎉 JACKPOT! 777 대박 (+' + win + ')' : '✨ 3개 일치! (+' + win + ')';
      } else if (r1 === r2 || r2 === r3 || r1 === r3) {
        var win2 = 15 * mult; coins += win2; msgEl.innerText = '👍 2개 일치! (+' + win2 + ')';
      } else { msgEl.innerText = '꽝! 다시 도전해 보세요.'; }
      isSpinning = false; updateDisplay();
    }, 1800);
  };

  var icons = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥑','🍔','🍕','🍩','🍦','🎈','🎁','⚽','🚀'];
  var c1 = null, c2 = null, pairs = 0, tries = 0, lock = false;

  chargeBtn.onclick = function() {
    document.getElementById('slotSection').style.display = 'none';
    document.getElementById('memorySection').style.display = 'block';
    var grid = document.getElementById('cardGrid'); grid.innerHTML = '';
    c1 = null; c2 = null; pairs = 0; tries = 0; lock = false;
    document.getElementById('pairsLeft').innerText = '18'; document.getElementById('attempts').innerText = '0';
    var deck = icons.concat(icons).sort(function() { return Math.random() - 0.5; });
    for (var i = 0; i < deck.length; i++) {
      var card = document.createElement('div'); card.className = 'card';
      card.setAttribute('data-icon', deck.slice(i, i + 1).shift()); card.innerText = '❓';
      card.onclick = function() {
        if (lock || this === c1 || this.classList.contains('matched')) return;
        this.classList.add('flipped'); this.innerText = this.getAttribute('data-icon');
        if (!c1) { c1 = this; return; }
        c2 = this; tries++; document.getElementById('attempts').innerText = tries; lock = true;
        if (c1.getAttribute('data-icon') === c2.getAttribute('data-icon')) {
          c1.classList.add('matched'); c2.classList.add('matched'); pairs++;
          document.getElementById('pairsLeft').innerText = 18 - pairs;
          c1 = null; c2 = null; lock = false;
          if (pairs === 18) {
            setTimeout(function() {
              alert('축하합니다! ' + tries + '번 만에 맞춰 100 코인이 충전되었습니다!');
              coins += 100; document.getElementById('memorySection').style.display = 'none';
              document.getElementById('slotSection').style.display = 'block';
              updateDisplay(); msgEl.innerText = '코인 충전 완료! 다시 돌려보세요.';
            }, 400);
          }
        } else {
          setTimeout(function() {
            c1.classList.remove('flipped'); c2.classList.remove('flipped');
            c1.innerText = '❓'; c2.innerText = '❓'; c1 = null; c2 = null; lock = false;
          }, 650);
        }
      };
      grid.appendChild(card);
    }
  };
  updateDisplay();
</script>
</body>
</html>
