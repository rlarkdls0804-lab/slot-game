<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>777 미니 슬롯머신</title>
<style>
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; margin: 0; background-color: #1a1a2e; color: #fff; font-family: sans-serif;
  }
  .machine {
    background: #16213e; padding: 30px; border-radius: 20px;
    border: 4px solid #e94560; box-shadow: 0 0 25px rgba(233, 69, 96, 0.5); text-align: center;
  }
  .score-board { font-size: 24px; margin-bottom: 20px; color: #ffd700; font-weight: bold; }
  .reels { display: flex; gap: 15px; margin-bottom: 25px; }
  .reel {
    width: 90px; height: 110px; background: #fff; color: #000; font-size: 54px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; border: 3px solid #0f3460; user-select: none;
  }
  button {
    padding: 15px 40px; font-size: 20px; font-weight: bold; cursor: pointer;
    background: #e94560; color: white; border: none; border-radius: 10px; transition: 0.2s;
  }
  button:disabled { background: #555; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #ff5e78; transform: scale(1.05); }
  #message { margin-top: 20px; font-size: 18px; height: 24px; color: #4ecca3; font-weight: bold; }
</style>
</head>
<body>

<div class="machine">
  <div class="score-board">보유 코인: <span id="coins">100</span></div>
  <div class="reels">
    <div class="reel" id="reel1">7️⃣</div>
    <div class="reel" id="reel2">7️⃣</div>
    <div class="reel" id="reel3">7️⃣</div>
  </div>
  <button id="spinBtn" onclick="spin()">SPIN (10 코인)</button>
  <div id="message">버튼을 눌러 시작하세요!</div>
</div>

<script>
  const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
  let coins = 100;
  let isSpinning = false;

  function spin() {
    if (isSpinning || coins < 10) return;
    
    coins -= 10;
    updateCoins();
    isSpinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('message').innerText = '행운을 빕니다...';

    const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    const results = [];

    // 릴 회전 연출 및 순차 정지
    reels.forEach((reel, index) => {
      let interval = setInterval(() => {
        reel.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      }, 70);

      setTimeout(() => {
        clearInterval(interval);
        const finalSymbol = symbols[Math.floor(Math.random() * symbols.length)];
        reel.innerText = finalSymbol;
        results[index] = finalSymbol;

        if (index === 2) checkResult(results);
      }, 1000 + index * 500);
    });
  }

  function checkResult(res) {
    let reward = 0;
    const msg = document.getElementById('message');

    if (res[0] === res[1] && res[1] === res[2]) {
      reward = (res[0] === '7️⃣') ? 500 : 100;
      msg.innerText = (res[0] === '7️⃣') ? '🎉 JACKPOT! 777 당첨 (+500)' : `✨ 3개 일치! (+${reward})`;
    } else if (res[0] === res[1] || res[1] === res[2] || res[0] === res[2]) {
      reward = 20;
      msg.innerText = '👍 2개 일치! (+20)';
    } else {
      msg.innerText = '아쉽네요! 다시 도전해 보세요.';
    }

    coins += reward;
    updateCoins();
    isSpinning = false;
    document.getElementById('spinBtn').disabled = coins < 10;
    if (coins < 10) msg.innerText = '코인이 모두 떨어졌습니다! (새로고침으로 재시작)';
  }

  function updateCoins() {
    document.getElementById('coins').innerText = coins;
  }
</script>
</body>
</html>
