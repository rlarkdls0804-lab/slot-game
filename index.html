<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>777 슬롯 & 기억력 충전소</title>
<style>
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; background-color: #1a1a2e; color: #fff; font-family: sans-serif;
    padding: 15px; box-sizing: border-box;
  }
  .container {
    background: #16213e; padding: 25px; border-radius: 20px;
    border: 4px solid #e94560; box-shadow: 0 0 25px rgba(233, 69, 96, 0.5);
    text-align: center; max-width: 420px; width: 100%;
  }
  .top-bar {
    display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .high-score-board {
    font-size: 14px; color: #4ecca3; font-weight: bold;
    background: rgba(15, 52, 96, 0.7); padding: 6px 12px; border-radius: 20px;
  }
  .reset-btn {
    background: #0f3460; color: #aaa; border: 1px solid #334; border-radius: 15px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .score-board { font-size: 24px; margin-bottom: 20px; color: #ffd700; font-weight: bold; }
  .reels { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .reel {
    width: 85px; height: 105px; background: #fff; color: #000; font-size: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; border: 3px solid #0f3460; user-select: none;
  }
  .bet-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .bet-btn {
    flex: 1; padding: 10px 0; font-size: 15px; font-weight: bold; cursor: pointer;
    background: #0f3460; color: #ccc; border: 2px solid #0f3460; border-radius: 8px;
  }
  .bet-btn.active { background: #1a1a2e; color: #ffd700; border-color: #ffd700; }
  .main-btn {
    padding: 14px 28px; font-size: 18px; font-weight: bold; cursor: pointer;
    background: #e94560; color: white; border: none; border-radius: 10px;
    width: 100%; margin-top: 6px;
  }
  .main-btn:disabled { background: #555; cursor: not-allowed; }
  #chargeBtn { background: #4ecca3; color: #1a1a2e; display: none; }
  #message { margin-top: 18px; font-size: 16px; min-height: 24px; color: #4ecca3; font-weight: bold; }

  /* 6x6 카드 기억력 게임 */
  #memorySection { display: none; }
  .memory-info { font-size: 15px; color: #ccc; margin-bottom: 15px; }
  .grid-6x6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 15px; }
  .card {
    aspect-ratio: 1 / 1; background: #0f3460; border: 2px solid #e94560;
    border-radius: 8px; font-size: 24px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; user-select: none;
  }
  .card.flipped, .card.matched { background: #fff; cursor: default; }
  .card.matched { border-color: #4ecca3; opacity: 0.7; }
</style>
</head>
<body>

<div class="container">
  <div id="slotSection">
    <div class="top-bar">
      <div class="high-score-board">🏆 최고 기록: <span id="highScore">100</span></div>
      <button type="button" class="reset-btn" id="resetBtn">초기화</button>
    </div>
    <div class="score-board">보유 코인: <span id="coins">100</span></div>
    
    <div class="reels">
      <div class="reel" id="reel1">7️⃣</div>
      <div class="reel" id="reel2">7️⃣</div>
      <div class="reel" id="reel3">7️⃣</div>
    </div>

    <div class="bet-selector">
      <button type="button" class="bet-btn active" id="bet10">10 코인 (x1)</button>
      <button type="button" class="bet-btn" id="bet50">50 코인 (x5)</button>
      <button type="button" class="bet-btn" id="bet100">100 코인 (x10)</button>
    </div>

    <button type="button" class="main-btn" id="spinBtn">SPIN (10 코인)</button>
    <button type="button" class="main-btn" id="chargeBtn">🃏 6x6 카드 맞추기로 코인 충전 (+100)</button>
    <div id="message">배팅 금액을 선택하고 SPIN을 누르세요!</div>
  </div>

  <div id="memorySection">
    <div class="score-board">🃏 6x6 기억력 충전소</div>
    <div class="memory-info">남은 짝: <span id="pairsLeft">18</span>쌍 | 시도 횟수: <span id="attempts">0</span>회</div>
    <div class="grid-6x6" id="cardGrid"></div>
  </div>
</div>

<script>
  var weightedSymbols = [
    '🍒', '🍒', '🍒', '🍒',
    '🍋', '🍋', '🍋', '🍋',
    '🍇', '🍇', '🍇',
    '🍉', '🍉', '🍉',
    '🍊', '🍊', '🍊',
    '🔔', '🔔',
    '💎', '💎',
    '7️⃣'
  ];

  function saveNumber(key, num) {
    try { localStorage.setItem(key, String(num)); } catch (e) {}
  }

  function loadNumber(key, defaultVal) {
    try {
      var val = localStorage.getItem(key);
      if (val !== null && val !== "" && !isNaN(Number(val))) {
        return Number(val);
      }
    } catch (e) {}
    return defaultVal;
  }

  var coins = loadNumber('slot_coins_v3', 100);
  var highScore = loadNumber('slot_high_v3', Math.max(100, coins));
  var currentBet = 10;
  var isSpinning = false;

  var spinBtn = document.getElementById('spinBtn');
  var chargeBtn = document.getElementById('chargeBtn');
  var resetBtn = document.getElementById('resetBtn');
  var msgEl = document.getElementById('message');

  function updateDisplay() {
    document.getElementById('coins').innerText = coins;
    saveNumber('slot_coins_v3', coins);
    if (coins > highScore) {
      highScore = coins;
      saveNumber('slot_high_v3', highScore);
    }
    document.getElementById('highScore').innerText = highScore;

    if (coins < 10) {
      spinBtn.disabled = true;
      chargeBtn.style.display = 'block';
      msgEl.innerText = '코인이 부족합니다! 미니게임으로 충전하세요.';
    } else if (coins < currentBet) {
      spinBtn.disabled = true;
      chargeBtn.style.display = 'none';
      msgEl.innerText = '보유 코인보다 배팅 금액이 큽니다. 금액을 낮춰주세요!';
    } else {
      spinBtn.disabled = isSpinning;
      chargeBtn.style.display = 'none';
    }
  }

  function selectBet(amount) {
    if (isSpinning) return;
    currentBet = amount;
    document.getElementById('bet10').className = (amount === 10) ? 'bet-btn active' : 'bet-btn';
    document.getElementById('bet50').className = (amount === 50) ? 'bet-btn active' : 'bet-btn';
    document.getElementById('bet100').className = (amount === 100) ? 'bet-btn active' : 'bet-btn';
    spinBtn.innerText = 'SPIN (' + currentBet + ' 코인)';
    updateDisplay();
  }

  document.getElementById('bet10').onclick = function() { selectBet(10); };
  document.getElementById('bet50').onclick = function() { selectBet(50); };
  document.getElementById('bet100').onclick = function() { selectBet(100); };

  resetBtn.onclick = function() {
    if (confirm('보유 코인과 최고 기록을 모두 100으로 초기화할까요?')) {
      coins = 100;
      highScore = 100;
      updateDisplay();
      msgEl.innerText = '초기화되었습니다!';
    }
  };

  function getRandomSymbol() {
    return weightedSymbols.slice(Math.floor(Math.random() * weightedSymbols.length)).shift();
  }

  spinBtn.onclick = function() {
    if (isSpinning || coins < currentBet) return;
    coins -= currentBet;
    isSpinning = true;
    updateDisplay();
    msgEl.innerText = '행운을 빕니다...';

    var reel1 = document.getElementById('reel1');
    var reel2 = document.getElementById('reel2');
    var reel3 = document.getElementById('reel3');

    var t1 = setInterval(function() { reel1.innerText = getRandomSymbol(); }, 70);
    var t2 = setInterval(function() { reel2.innerText = getRandomSymbol(); }, 70);
    var t3 = setInterval(function() { reel3.innerText = getRandomSymbol(); }, 70);

    var r1 = '', r2 = '', r3 = '';

    setTimeout(function() {
      clearInterval(t1);
      r1 = getRandomSymbol();
      reel1.innerText = r1;
    }, 900);

    setTimeout(function() {
      clearInterval(t2);
      r2 = getRandomSymbol();
      reel2.innerText = r2;
    }, 1350);

    setTimeout(function() {
      clearInterval(t3);
      r3 = getRandomSymbol();
      reel3.innerText = r3;
      finishSpin(r1, r2, r3);
    }, 1800);
  };

  function finishSpin(r1, r2, r3) {
    var mult = currentBet / 10;
    if (r1 === r2 && r2 === r3) {
      var base = (r1 === '7️⃣') ? 1000 : (r1 === '💎' ? 300 : 100);
      var win = base * mult;
      coins += win;
      msgEl.innerText = (r1 === '7️⃣') ? '🎉 JACKPOT! 777 대박 (+' + win + ')' : '✨ 3개 일치! (+' + win + ')';
    } else if (r1 === r2 || r2 === r3 || r1 === r3) {
      var win2 = 15 * mult;
      coins += win2;
      msgEl.innerText = '👍 2개 일치! (+' + win2 + ')';
    } else {
      msgEl.innerText = '꽝! 다시 도전해 보세요.';
    }
    isSpinning = false;
    updateDisplay();
  }

  // --- 6x6 카드 기억력 게임 ---
  var cardIcons = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍','🥝','🥑','🍔','🍕','🍩','🍦','🎈','🎁','⚽','🚀'];
  var firstCard = null;
  var secondCard = null;
  var matchedPairs = 0;
  var attempts = 0;
  var lockBoard = false;

  chargeBtn.onclick = function() {
    document.getElementById('slotSection').style.display = 'none';
    document.getElementById('memorySection').style.display = 'block';
    var grid = document.getElementById('cardGrid');
    grid.innerHTML = '';
    firstCard = null;
    secondCard = null;
    matchedPairs = 0;
    attempts = 0;
    lockBoard = false;
    document.getElementById('pairsLeft').innerText = '18';
    document.getElementById('attempts').innerText = '0';

    var deck = cardIcons.concat(cardIcons).sort(function() { return Math.random() - 0.5; });
    for (var i = 0; i < deck.length; i++) {
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-icon', deck.slice(i, i + 1).shift());
      card.innerText = '❓';
      card.onclick = handleCardClick;
      grid.appendChild(card);
    }
  };

  function handleCardClick() {
    if (lockBoard || this === firstCard || this.classList.contains('matched')) return;
    this.classList.add('flipped');
    this.innerText = this.getAttribute('data-icon');

    if (!firstCard) {
      firstCard = this;
      return;
    }
    secondCard = this;
    attempts++;
    document.getElementById('attempts').innerText = attempts;
    lockBoard = true;

firstCard.classList.add('matched');
secondCard.classList.add('matched');
matchedPairs++;
document.getElementById('pairsLeft').innerText = 18 - matchedPairs;

setTimeout(function() {
alert('축하합니다! ' + attempts + '번 만에 모두 맞춰 100 코인이 충전되었습니다!');
coins += 100;
document.getElementById('memorySection').style.display = 'none';
document.getElementById('slotSection').style.display = 'block';
updateDisplay();
msgEl.innerText = '코인 충전 완료! 다시 돌려보세요.';
}, 400);
}
} else {
setTimeout(function() {
firstCard.classList.remove('flipped');
secondCard.classList.remove('flipped');
firstCard.innerText = '❓';
secondCard.innerText = '❓';
firstCard = null;
secondCard = null;
lockBoard = false;
}, 650);
}
}
updateDisplay();
